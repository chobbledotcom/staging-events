<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70">
  <!-- Simplified hand silhouette -->
  <g transform="translate(5,2) scale(0.75)" fill="#878787" opacity="0.85">
    <!-- Palm -->
    <ellipse cx="38" cy="45" rx="28" ry="24"/>
    <!-- Thumb -->
    <ellipse cx="8" cy="30" rx="8" ry="14" transform="rotate(-30 8 30)"/>
    <!-- Index finger -->
    <ellipse cx="20" cy="8" rx="6" ry="16" transform="rotate(10 20 8)"/>
    <!-- Middle finger -->
    <ellipse cx="36" cy="5" rx="6" ry="18"/>
    <!-- Ring finger -->
    <ellipse cx="52" cy="8" rx="6" ry="16" transform="rotate(-8 52 8)"/>
    <!-- Pinky finger -->
    <ellipse cx="65" cy="16" rx="5" ry="13" transform="rotate(-15 65 16)"/>
  </g>
  <!-- CoppaFeel! text -->
  <text x="62" y="50" font-family="'Arial Rounded MT Bold','Nunito',Arial,sans-serif" font-size="38" font-weight="800" fill="#e61f6c" letter-spacing="-0.5">CoppaFeel!</text>
</svg>
